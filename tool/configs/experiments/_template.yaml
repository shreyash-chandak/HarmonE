# Experiment grid config template.
# Copy and rename; fill all fields before running run_grid.py.
# All paths relative to this file unless absolute.

name: my_experiment               # short tag used in run directory names

datasets:
  - pems_node1                    # keys matching configs/datasets/<name>.json

planners:
  - naive
  - random_switch
  - greedy_switch
  - harmone_original
  - violation_aware
  - pareto
  # - bandit                      # uncomment when S7 is implemented

seeds: [1, 2, 3, 4, 5]

cooldown_minutes: 20              # wall-clock gap between runs on the same machine

# Periodic Retraining Baselines (PRT)
prt_baselines:
  enabled: true
  period_steps: 3200              # retrain every N inference steps regardless of signals

# Output
runs_dir: runs/                   # parent directory for run sub-directories
resume: true                      # skip already-completed (run_dir contains run_manifest.json)
